<!DOCTYPE html>
<html lang="ko">

<head>
    
    <meta charset="UTF-8">

    <title>subway-congestion-dashboard</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <div class="container">

        <!-- 상단 제목 -->
        <header class="header">
            <h1>시간을 나타내는 이미지</h1>
        </header>

        <!-- 메인 영역 -->
        <main class="main">

            <!-- 왼쪽 호선 선택 -->
            <div class="line-selector" id="lineSelector">

                <button class="line-btn active" data-line="1">1</button>
                <button class="line-btn" data-line="2">2</button>
                <button class="line-btn" data-line="3">3</button>
                <button class="line-btn" data-line="4">4</button>
                <button class="line-btn" data-line="5">5</button>
                <button class="line-btn" data-line="6">6</button>
                <button class="line-btn" data-line="7">7</button>
                <button class="line-btn" data-line="8">8</button>

            </div>

            <!-- 중앙 영역 : 노선도 제외 -->
            <div class="center-area">

                <div class="center-text" id="selectionInfo">
                    1호선 · 상선 · 평일 · 4:30
                </div>

            </div>

            <!-- 오른쪽 선택 패널 -->
            <div class="right-panel">

                <!-- 방향 및 요일 -->
                <div class="toggle-box">

                    <div class="toggle-row" id="directionSelector">

                        <button class="toggle-btn active" data-value="상선">
                            상선
                        </button>

                        <button class="toggle-btn" data-value="하선">
                            하선
                        </button>

                    </div>

                    <div class="toggle-row" id="daySelector">

                        <button class="toggle-btn active" data-value="평일">
                            평일
                        </button>

                        <button class="toggle-btn" data-value="토요일">
                            토요일
                        </button>

                        <button class="toggle-btn" data-value="일요일">
                            일요일
                        </button>

                    </div>

                </div>

                <!-- 시간 선택 -->
                <div class="time-picker" id="timePicker">

                    <div class="time-item" id="prevTime"></div>

                    <div class="time-item selected" id="currentTime"></div>

                    <div class="time-item" id="nextTime"></div>

                </div>

            </div>

        </main>

        <!-- 혼잡도 범례 -->
        <div class="legend">

            <div class="legend-item">
                <span class="dot green"></span>
                원활
            </div>

            <div class="legend-item">
                <span class="dot yellow"></span>
                보통
            </div>

            <div class="legend-item">
                <span class="dot pink"></span>
                혼잡
            </div>

            <div class="legend-item">
                <span class="dot red"></span>
                매우 혼잡
            </div>

        </div>

    </div>

</body>
</html>
